# Render blueprint for the Freight Charter Compass backend.
#
# Deploy: on Render, "New +" -> "Blueprint" -> connect this GitHub repo ->
# Render reads this file and provisions the service below. Free tier: the
# service spins down after inactivity and cold-starts on the next request
# (a few seconds) -- fine for a feedback/demo link, not for a production SLA.
#
# freight.db is rebuilt from the seed files on every startup (see
# app/db/seed.py's run_seed(), called from main.py's lifespan handler) --
# so Render's ephemeral filesystem (wiped on every redeploy/restart) is not
# a problem here; there is nothing stateful to lose.
#
# After the first deploy, copy this service's https://<name>.onrender.com
# URL into the frontend's VITE_API_BASE (Vercel project env var) and into
# this service's own ALLOWED_ORIGINS env var (comma-separated, set in the
# Render dashboard -- add the Vercel URL there so the deployed frontend's
# browser fetches aren't blocked by CORS). See DECISIONS.md #27.
services:
  - type: web
    name: freight-charter-compass-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: ALLOWED_ORIGINS
        value: ""
